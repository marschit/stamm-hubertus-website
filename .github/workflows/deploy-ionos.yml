name: Auf IONOS-Webspace veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Alle 2 Stunden neu bauen: holt Termine aus dem Nextcloud-Kalender
    # und räumt vergangene Termine weg
    - cron: '17 5-21/2 * * *'

concurrency:
  group: ionos-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Zugangsdaten prüfen
        id: secrets
        run: echo "vorhanden=${{ secrets.IONOS_HOST != '' && secrets.IONOS_USER != '' && secrets.IONOS_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Hinweis bei fehlenden Zugangsdaten
        if: steps.secrets.outputs.vorhanden != 'true'
        run: echo "IONOS_HOST/IONOS_USER/IONOS_PASSWORD sind nicht als Repo-Secrets hinterlegt – Deploy übersprungen."

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.vorhanden == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.vorhanden == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.vorhanden == 'true'

      - run: npm run build
        if: steps.secrets.outputs.vorhanden == 'true'
        env:
          NC_KALENDER_URL: ${{ secrets.NC_KALENDER_URL }}
          NC_KALENDER_USER: ${{ secrets.NC_KALENDER_USER }}
          NC_KALENDER_PASS: ${{ secrets.NC_KALENDER_PASS }}

      - name: Per rsync über SSH hochladen
        if: steps.secrets.outputs.vorhanden == 'true'
        env:
          SSHPASS: ${{ secrets.IONOS_PASSWORD }}
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_DIR: ${{ secrets.IONOS_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          # fotoeingang/: Sperr-.htaccess mit hochladen, eingereichte Fotos
          # auf dem Server aber weder überschreiben noch löschen
          sshpass -e rsync -rltz --delete \
            --include='fotoeingang/' \
            --include='fotoeingang/.htaccess' \
            --exclude='fotoeingang/*' \
            -e "ssh -p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            dist/ "$IONOS_USER@$IONOS_HOST:$IONOS_DIR"
