name: Auf IONOS-Webspace veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Alle 2 Stunden neu bauen: holt Termine aus dem Nextcloud-Kalender
    # und räumt vergangene Termine weg
    - cron: '17 5-21/2 * * *'

concurrency:
  group: ionos-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Zugangsdaten prüfen
        id: secrets
        run: echo "vorhanden=${{ secrets.IONOS_HOST != '' && secrets.IONOS_USER != '' && secrets.IONOS_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Hinweis bei fehlenden Zugangsdaten
        if: steps.secrets.outputs.vorhanden != 'true'
        run: echo "IONOS_HOST/IONOS_USER/IONOS_PASSWORD sind nicht als Repo-Secrets hinterlegt – Deploy übersprungen."

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.vorhanden == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.vorhanden == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.secrets.outputs.vorhanden == 'true'

      - run: npm run build
        if: steps.secrets.outputs.vorhanden == 'true'
        env:
          NC_KALENDER_URL: ${{ secrets.NC_KALENDER_URL }}
          NC_KALENDER_USER: ${{ secrets.NC_KALENDER_USER }}
          NC_KALENDER_PASS: ${{ secrets.NC_KALENDER_PASS }}

      - name: Per rsync über SSH hochladen
        if: steps.secrets.outputs.vorhanden == 'true'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_DIR: ${{ secrets.IONOS_DIR }}
          IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
        run: |
          # Schlüssel-Login statt Passwort: triggert IONOS' Brute-Force-Schutz nicht
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$IONOS_SSH_KEY" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          # fotoeingang/: Sperr-.htaccess mit hochladen, eingereichte Fotos
          # auf dem Server aber weder überschreiben noch löschen.
          for versuch in 1 2 3; do
            if timeout 150 rsync -rltz --delete \
              --include='fotoeingang/' \
              --include='fotoeingang/.htaccess' \
              --exclude='fotoeingang/*' \
              -e "ssh -i ~/.ssh/deploy-key -o IdentitiesOnly=yes -p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
              dist/ "$IONOS_USER@$IONOS_HOST:$IONOS_DIR"; then
              echo "Deploy in Versuch $versuch erfolgreich."
              exit 0
            fi
            echo "Versuch $versuch fehlgeschlagen – warte 45 s …"
            sleep 45
          done
          echo "Alle Versuche fehlgeschlagen."
          exit 1
