media:
  input: public/bilder
  output: /bilder

content:
  - name: aktuelles
    label: Aktuelles
    description: Neuigkeiten und Berichte aus dem Stammesleben
    type: collection
    path: src/content/aktuelles
    view:
      fields: [titel, datum]
      sort: [datum]
      default:
        sort: datum
        order: desc
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
      - name: datum
        label: Datum
        type: date
        required: true
      - name: bild
        label: Titelbild (optional)
        type: image
      - name: body
        label: Text
        type: rich-text

  - name: termine
    label: Termine
    description: Lager, Fahrten und Aktionen – erscheinen auf der Terminseite und im Kalender-Abo
    type: collection
    path: src/content/termine
    view:
      fields: [titel, datum, kategorie]
      sort: [datum]
      default:
        sort: datum
        order: desc
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
      - name: datum
        label: Datum (bei mehrtägigen Terminen der erste Tag)
        type: date
        required: true
      - name: endDatum
        label: End-Datum (nur bei mehrtägigen Terminen)
        type: date
      - name: zeit
        label: Uhrzeit (optional, z. B. "15:00" oder "15:00 – 17:00" – leer lassen für ganztägig)
        type: string
      - name: ort
        label: Ort (optional)
        type: string
      - name: kategorie
        label: Für wen?
        type: select
        default: stamm
        options:
          values:
            - value: stamm
              label: Ganzer Stamm
            - value: meute
              label: Meute
            - value: sippen
              label: Sippen
            - value: gilde
              label: Kreis
            - value: foerderverein
              label: Förderverein
            - value: heimbelegung
              label: Heim belegt (Vermietung)
            - value: anhaenger
              label: Anhänger vermietet
      - name: body
        label: Beschreibung (optional)
        type: rich-text

  - name: gruppen
    label: Gruppen
    description: Die Gruppen des Stammes (Meute, Sippen, Kreis)
    type: collection
    path: src/content/gruppen
    view:
      fields: [name, stufe, alter]
      sort: [reihenfolge]
    fields:
      - name: name
        label: Name der Gruppe
        type: string
        required: true
      - name: stufe
        label: Stufe
        type: string
        description: z. B. Wölflingsstufe, Pfadfinderstufe, Ranger & Rover
        required: true
      - name: alter
        label: Altersangabe
        type: string
        required: true
      - name: farbe
        label: Farbe der Karte
        type: select
        options:
          values:
            - value: gelb
              label: Wölflingsgelb
            - value: blau
              label: Pfadiblau
            - value: rot
              label: R*R-Rot
            - value: gruen
              label: Waldgrün
      - name: icon
        label: Icon (BdP-Icon aus /bdp/)
        type: string
        default: /bdp/icon-kohte.png
      - name: abzeichen
        label: Abzeichen auf der Detailseite (Pfad, z. B. /bdp/wolfskopf.svg)
        type: string
      - name: abzeichenText
        label: Bildunterschrift zum Abzeichen
        type: string
      - name: reihenfolge
        label: Reihenfolge
        type: number
      - name: treffzeit
        label: Eigene Treffzeit (optional, sonst gilt die Standard-Treffzeit)
        type: string
      - name: body
        label: Beschreibung
        type: rich-text

  - name: seiten
    label: Seiten
    description: Feste Seiten wie Über uns, Kontakt, Förderverein
    type: collection
    path: src/content/seiten
    view:
      fields: [titel]
    fields:
      - name: titel
        label: Seitentitel
        type: string
        required: true
      - name: untertitel
        label: Untertitel (optional)
        type: string
      - name: body
        label: Inhalt
        type: rich-text

  - name: galerie
    label: Fotoalben
    description: Fotoalben für die Galerie – Bilder vorher unter „Medien“ hochladen
    type: collection
    path: src/content/galerie
    view:
      fields: [titel, datum]
      sort: [datum]
      default:
        sort: datum
        order: desc
    fields:
      - name: titel
        label: Albumtitel
        type: string
        required: true
      - name: datum
        label: Datum der Veranstaltung
        type: date
        required: true
      - name: bilder
        label: Fotos
        type: object
        list: true
        fields:
          - name: bild
            label: Foto
            type: image
            required: true
          - name: text
            label: Bildunterschrift (optional)
            type: string
      - name: body
        label: Beschreibung (optional)
        type: rich-text

  - name: ferien
    label: Schulferien (NRW)
    description: In diesen Zeiträumen fällt der Heimabend aus – bitte jedes Jahr um die neuen NRW-Ferien ergänzen (schulministerium.nrw)
    type: file
    path: src/data/ferien.json
    fields:
      - name: ferien
        label: Ferienzeiträume
        type: object
        list: true
        fields:
          - name: name
            label: Name (z. B. Herbstferien 2026)
            type: string
            required: true
          - name: von
            label: Erster Ferientag
            type: date
            required: true
          - name: bis
            label: Letzter Ferientag
            type: date
            required: true

  - name: startseite
    label: Startseite
    description: Überschriften und Texte der Startseite
    type: file
    path: src/data/startseite.json
    fields:
      - name: heldTitelZeile1
        label: Große Überschrift – Zeile 1 (weiß)
        type: string
      - name: heldTitelZeile2
        label: Große Überschrift – Zeile 2 (gelb)
        type: string
      - name: heldText
        label: Text unter der Überschrift
        type: text
      - name: karteLabel
        label: Gelbe Karte – kleine Überschrift
        type: string
      - name: karteHinweis
        label: Gelbe Karte – Hinweiszeile unten
        type: string
      - name: eyebrowGruppen
        label: Kleine rote Zeile über „Unsere Gruppen“
        type: string
      - name: eyebrowAktuelles
        label: Kleine rote Zeile über „Aktuelles“
        type: string
      - name: eyebrowMitmachen
        label: Kleine rote Zeile über dem Mitmachen-Abschnitt
        type: string
      - name: mitmachenTitel
        label: Mitmachen-Abschnitt – Überschrift
        type: string
      - name: mitmachenAbsatz1
        label: Mitmachen-Abschnitt – Absatz 1
        type: text
      - name: mitmachenAbsatz2
        label: Mitmachen-Abschnitt – Absatz 2
        type: text
      - name: teaserTermineTitel
        label: Kachel „Nächste Termine“ – Überschrift
        type: string
      - name: teaserHeimTitel
        label: Kachel Stammesheim – Überschrift
        type: string
      - name: teaserHeimText
        label: Kachel Stammesheim – Text
        type: text
      - name: teaserHeimButton
        label: Kachel Stammesheim – Button-Beschriftung
        type: string

  - name: navigation
    label: Menü
    description: Die Menüleiste oben – Bezeichnungen, Reihenfolge und Einträge
    type: file
    path: src/data/navigation.json
    fields:
      - name: eintraege
        label: Menüpunkte oben (Reihenfolge per Ziehen ändern)
        type: object
        list: true
        fields:
          - name: label
            label: Bezeichnung im Menü
            type: string
            required: true
          - name: href
            label: Ziel (Seitenpfad, z. B. /termine)
            type: string
            required: true
          - name: gruppenAutomatik
            label: Gruppen automatisch als Untermenü anhängen
            type: boolean
          - name: unter
            label: Eigene Unterpunkte (machen den Eintrag zum Aufklapp-Menü)
            type: object
            list: true
            fields:
              - name: label
                label: Bezeichnung
                type: string
                required: true
              - name: href
                label: Ziel
                type: string
                required: true
      - name: fusszeile
        label: Links in der Fußleiste
        type: object
        list: true
        fields:
          - name: label
            label: Bezeichnung
            type: string
            required: true
          - name: href
            label: Ziel (Seitenpfad oder https://…)
            type: string
            required: true

  - name: einstellungen
    label: Einstellungen
    description: Adresse, Treffzeit, Kontaktdaten, Kalender-Links
    type: file
    path: src/data/einstellungen.json
    fields:
      - name: verein
        label: Vereinsname
        type: string
      - name: claim
        label: Kurzbeschreibung
        type: string
      - name: treffzeit
        label: Treffzeit
        type: string
      - name: adresse
        label: Adresse
        type: string
      - name: email
        label: E-Mail
        type: string
      - name: telefon
        label: Telefon
        type: string
      - name: facebook
        label: Facebook-Link
        type: string
        description: Leer lassen blendet das Symbol in der Fußzeile aus.
      - name: instagram
        label: Instagram-Link
        type: string
        description: Leer lassen blendet das Symbol in der Fußzeile aus.
      - name: bluesky
        label: Bluesky-Link
        type: string
        description: Leer lassen blendet das Symbol in der Fußzeile aus.
      - name: mastodon
        label: Mastodon-Link
        type: string
        description: Leer lassen blendet das Symbol in der Fußzeile aus.
